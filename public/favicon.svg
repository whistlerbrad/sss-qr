<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#fff"/>
  <!-- QR-style: finder patterns (corners) + modules -->
  <!-- Top-left finder -->
  <rect x="0" y="0" width="10" height="10" fill="#0f172a"/>
  <rect x="2" y="2" width="6" height="6" fill="#fff"/>
  <rect x="4" y="4" width="2" height="2" fill="#0f172a"/>
  <!-- Top-right finder -->
  <rect x="22" y="0" width="10" height="10" fill="#0f172a"/>
  <rect x="24" y="2" width="6" height="6" fill="#fff"/>
  <rect x="26" y="4" width="2" height="2" fill="#0f172a"/>
  <!-- Bottom-left finder -->
  <rect x="0" y="22" width="10" height="10" fill="#0f172a"/>
  <rect x="2" y="24" width="6" height="6" fill="#fff"/>
  <rect x="4" y="26" width="2" height="2" fill="#0f172a"/>
  <!-- Center modules (data pattern) -->
  <rect x="12" y="12" width="4" height="4" fill="#0f172a"/>
  <rect x="18" y="12" width="2" height="2" fill="#0f172a"/>
  <rect x="12" y="18" width="2" height="2" fill="#0f172a"/>
  <rect x="16" y="16" width="4" height="4" fill="#0f172a"/>
  <rect x="22" y="18" width="4" height="2" fill="#0f172a"/>
  <rect x="18" y="22" width="2" height="4" fill="#0f172a"/>
</svg>
